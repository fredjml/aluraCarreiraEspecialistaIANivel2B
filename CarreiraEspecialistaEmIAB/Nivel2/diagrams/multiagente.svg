<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura multiagente do Bytebank</title>
  <desc id="desc">Supervisor, agentes A2A, servidor MCP, recursos, ferramentas e aprovação humana.</desc>
  <defs><style>.bg{fill:#f7fafc}.band{fill:#0f3557}.box{fill:#fff;stroke:#0f5a8a;stroke-width:2}.agent{fill:#eaf4fb;stroke:#0f5a8a;stroke-width:2}.mcp{fill:#fff4df;stroke:#d98200;stroke-width:2}.hitl{fill:#e7f6ef;stroke:#16805b;stroke-width:2}.t{font:600 17px Arial;fill:#16324a}.s{font:14px Arial;fill:#35556f}.h{font:700 30px Arial;fill:#fff}.arrow{stroke:#55788f;stroke-width:2.5;fill:none;marker-end:url(#a)}.a2a{font:700 13px Arial;fill:#0f5a8a}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55788f"/></marker></defs>
  <rect class="bg" width="1400" height="820" rx="20"/><rect class="band" width="1400" height="92" rx="20"/><rect class="band" y="70" width="1400" height="22"/><text class="h" x="48" y="56">Bytebank · Arquitetura multiagente, A2A, MCP e HITL</text>
  <rect class="box" x="54" y="150" width="190" height="88" rx="12"/><text class="t" x="76" y="184">Front-end Gradio</text><text class="s" x="76" y="213">mensagem / resposta</text>
  <rect class="box" x="312" y="128" width="284" height="132" rx="12"/><text class="t" x="334" y="164">BFA · Supervisor</text><text class="s" x="334" y="194">classificação Gemini</text><text class="s" x="334" y="218">fallback local rastreável</text><text class="s" x="334" y="242">síntese + Agent Cards</text>
  <path class="arrow" d="M244 194H312"/>
  <rect class="agent" x="690" y="116" width="250" height="88" rx="12"/><text class="t" x="712" y="151">Agente conta_corrente</text><text class="s" x="712" y="179">Pix · saldo · abertura</text>
  <rect class="agent" x="690" y="238" width="250" height="88" rx="12"/><text class="t" x="712" y="273">Agente cartao_credito</text><text class="s" x="712" y="301">fatura · cartão · Platinum</text>
  <rect class="agent" x="690" y="360" width="250" height="88" rx="12"/><text class="t" x="712" y="395">Agente suporte</text><text class="s" x="712" y="423">SLA · canais · reclamação</text>
  <path class="arrow" d="M596 174H690"/><path class="arrow" d="M596 194C640 194 640 282 690 282"/><path class="arrow" d="M596 214C640 214 640 404 690 404"/><text class="a2a" x="624" y="164">A2A</text><text class="a2a" x="634" y="267">A2A</text><text class="a2a" x="634" y="389">A2A</text>
  <rect class="mcp" x="1042" y="220" width="286" height="132" rx="12"/><text class="t" x="1064" y="258">MCP Server stdio</text><text class="s" x="1064" y="288">resources · tools · prompts</text><text class="s" x="1064" y="314">core externo opcional</text><text class="s" x="1064" y="338">sem token → not_configured</text>
  <path class="arrow" d="M940 160C990 160 990 252 1042 252"/><path class="arrow" d="M940 282H1042"/><path class="arrow" d="M940 404C990 404 990 320 1042 320"/>
  <rect class="mcp" x="1010" y="422" width="318" height="112" rx="12"/><text class="t" x="1032" y="458">Recursos de leitura</text><text class="s" x="1032" y="486">políticas · saldo · fatura</text><text class="s" x="1032" y="510">URI + controle de acesso</text>
  <rect class="mcp" x="1010" y="568" width="318" height="112" rx="12"/><text class="t" x="1032" y="604">Ferramentas de mutação</text><text class="s" x="1032" y="632">criar_conta · solicitar_cartao</text><text class="s" x="1032" y="656">aprovação humana obrigatória</text>
  <path class="arrow" d="M1185 352V422"/><path class="arrow" d="M1210 352V568"/>
  <rect class="hitl" x="610" y="554" width="298" height="126" rx="12"/><text class="t" x="634" y="590">HITL · cartão Platinum</text><text class="s" x="634" y="620">snapshot + pausa auditável</text><text class="s" x="634" y="646">aprovar → MCP · cancelar → fim</text>
  <path class="arrow" d="M814 326V554"/><path class="arrow" d="M908 616H1010"/>
  <rect class="box" x="54" y="570" width="430" height="110" rx="12"/><text class="t" x="76" y="606">Memórias e observabilidade</text><text class="s" x="76" y="635">semântica · episódica · procedural</text><text class="s" x="76" y="660">estado · fallbacks · trilha de auditoria</text><path class="arrow" d="M454 260V570"/>
  <rect class="band" x="54" y="742" width="1274" height="48" rx="10"/><text x="76" y="773" style="font:600 15px Arial;fill:#fff">Limite de segurança: dados fictícios; nenhuma mutação ocorre sem aprovação humana e configuração explícita do core.</text>
</svg>
