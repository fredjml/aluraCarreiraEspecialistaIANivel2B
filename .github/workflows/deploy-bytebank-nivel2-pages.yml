name: Deploy Bytebank Nivel2 Pages

on:
  push:
    branches: [main]
    paths:
      - "CarreiraEspecialistaEmIAB/Nivel2/**"
      - ".github/workflows/deploy-bytebank-nivel2-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Nivel2
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CarreiraEspecialistaEmIAB/Nivel2
          sparse-checkout-cone-mode: false

      - name: Montar artefato estatico
        run: |
          mkdir _site
          cp -R CarreiraEspecialistaEmIAB/Nivel2/. _site/
          touch _site/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4