  <rect class="box" x="572" y="160" width="220" height="100" rx="12"/><text class="t" x="592" y="195">Chunking 500/100</text><text class="s" x="592" y="225">categoria semântica</text>
  <rect class="ai" x="834" y="160" width="230" height="100" rx="12"/><text class="t" x="854" y="195">Embeddings locais</text><text class="s" x="854" y="225">all-MiniLM-L6-v2</text>
