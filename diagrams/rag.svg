<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura RAG do Bytebank</title>
  <desc id="desc">Fluxo completo de ingestão, Chroma, recuperação híbrida, reranking, geração e auditoria.</desc>
  <defs>
    <style>
      .bg{fill:#f7fafc}.band{fill:#0f3557}.box{fill:#fff;stroke:#0f5a8a;stroke-width:2}.data{fill:#eaf4fb;stroke:#0f5a8a;stroke-width:2}.ai{fill:#fff4df;stroke:#d98200;stroke-width:2}.guard{fill:#e7f6ef;stroke:#16805b;stroke-width:2}.t{font:600 18px Arial;fill:#16324a}.s{font:14px Arial;fill:#35556f}.h{font:700 30px Arial;fill:#fff}.lane{font:700 17px Arial;fill:#0f5a8a}.arrow{stroke:#55788f;stroke-width:2.5;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55788f"/></marker>
